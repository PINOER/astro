    <!-- Main Hook & Stem -->
    <path d="M 256 112 
             C 192 112, 148 152, 148 212 
             C 148 230, 162 244, 180 244 
             C 198 244, 212 230, 212 212 
             C 212 188, 228 168, 256 168 
             C 284 168, 300 188, 300 210 
             C 300 234, 286 248, 262 268 
             C 232 292, 222 316, 222 352 
             L 222 364 
             C 222 380, 236 392, 256 392 
             C 276 392, 290 380, 290 364 
             L 290 358 
             C 290 338, 298 328, 322 308 
             C 352 282, 364 252, 364 210 
             C 364 152, 320 112, 256 112 Z" />
    
    <!-- Dot -->
    <circle cx="256" cy="434" r="32" />
